<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>maxmap</title>
<style>
  :root { --t: 64px; --ink: #2b2a26; --bar: #33402f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #1d231b; color: #fff; overflow: hidden;
    font: 18px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    user-select: none;
  }

  /* ─── верхня панель ─── */
  #hud {
    width: 100%; height: 56px; flex: none; padding: 0 16px;
    display: flex; align-items: center; gap: 24px; background: var(--bar);
  }
  #day { font-weight: 700; min-width: 90px; }
  #turn { display: flex; align-items: center; gap: 10px; }
  #turnHero .token { --s: 44px; position: relative; }
  #steps { display: flex; }
  #steps img { width: 44px; height: 44px; margin: 0 -10px; }
  #hud button {
    padding: 9px 18px; border: 0; border-radius: 8px; cursor: pointer;
    font-family: inherit; font-size: 17px; font-weight: 700;
  }
  #hud button:hover { filter: brightness(1.08); }
  #endTurn { margin-left: auto; background: #f2c14e; color: var(--ink); }
  #newGame { background: #5b7a52; color: #fff; }
  #hud #mute { background: none; padding: 4px 6px; font-size: 26px; line-height: 1; }

  /* ─── карта ─── */
  #stageWrap { flex: 1; display: flex; align-items: center; justify-content: center; }
  #viewport {
    position: relative; overflow: hidden; cursor: pointer;
    width: calc(var(--t) * 11); height: calc(var(--t) * 9);
  }
  #world { position: absolute; left: 0; top: 0; transition: transform 220ms ease-out; }
  #world.no-anim, #world.no-anim .hero { transition: none; }
  .cell { position: absolute; width: var(--t); height: var(--t); display: block; pointer-events: none; }
  .tile { image-rendering: auto; }
  .mark.far { opacity: .6; }
  /* ─── туман: пухкі хмаринки, кожна більша за клітинку, щоб зливались ─── */
  .fog-layer { position: absolute; left: 0; top: 0; }
  .fog {
    --c: #eef3f6;
    width: calc(var(--t) * 1.7); height: calc(var(--t) * 1.7);
    margin: calc(var(--t) * -.35);
    background:
      radial-gradient(circle at 35% 40%, #fff 0 18%, transparent 30%),
      radial-gradient(circle, var(--c) 0 48%, transparent 70%);
    transition: opacity 600ms ease-out, transform 600ms ease-out;
  }
  .fog-1 { --c: #e3ebf0; }
  .fog-2 { --c: #f4f7f9; }
  .fog.gone { opacity: 0; transform: scale(1.5); }
  /* ─── фішка: коло з аватаркою + артефакти ззовні (docs/07-fishka.md) ─── */
  .token { --s: var(--t); width: var(--s); height: var(--s); }
  .token .disc {
    position: absolute; left: 8%; top: 8%; width: 84%; height: 84%; z-index: 1;
    border-radius: 50%; overflow: hidden;
    border: calc(var(--s) * .05) solid var(--ring, #fff);
    background: radial-gradient(circle at 60% 35%, #ffffff 0%, #e6f2dc 70%, #cfe4c2 100%);
    box-shadow: 0 calc(var(--s) * .04) calc(var(--s) * .06) rgba(0, 0, 0, .35);
  }
  .token .avatar { position: absolute; left: -3%; top: -1%; width: 106%; height: 106%; }
  .token .avatar.item { left: 10%; top: 8%; width: 80%; height: 80%; }   /* річ у колі позначки призу */
  .token .slot { position: absolute; }
  .token .slot img { display: block; width: 100%; height: 100%; }
  /* sides: крило — праве, корінь (лівий край картинки) ховається за колом */
  .token .slot-sides { top: 4%; width: 60%; height: 60%; }
  .token .slot-sides.right { left: 66%; }
  .token .slot-sides.left  { right: 66%; scale: -1 1; }
  .token .slot-sides img { transform-origin: 10% 50%; animation: flap 1.4s ease-in-out infinite; }
  @keyframes flap {
    0%, 100% { transform: rotate(-12deg); }
    50%      { transform: rotate(10deg); }
  }
  /* майбутні слоти: feet — під колом, top — над колом */
  .token .slot-feet { left: 21%; top: 57%; width: 60%; height: 60%; z-index: 2; }
  .token .slot-feet.art-duck { left: 30%; top: 62%; width: 46%; height: 46%; }   /* качечка — маленький значок */
  .token .slot-feet.art-stilts { left: 15%; top: 50%; width: 70%; height: 80%; z-index: 0; }   /* ходулі — довгі, з-під кола */
  .token .slot-top  { left: 25%; top: -18%; width: 50%; height: 34%; z-index: 2; }
  /* антенки — з-за кола (корінці ховаються), пружинять; зірки тоді вище */
  .token .slot-top.art-antennae { left: 20%; top: -40%; width: 60%; height: 60%; z-index: 0; }
  .token .slot-top.art-antennae img { transform-origin: 50% 100%; animation: boing 1.1s ease-in-out infinite alternate; }
  @keyframes boing {
    from { transform: rotate(-5deg) scaleY(.94); }
    to   { transform: rotate(5deg) scaleY(1.05); }
  }
  .token.with-top .stars { top: -62%; }
  .token.with-top .stars.big { top: -76%; }
  /* hand: збоку внизу, наче герой тримає річ у руці (перчинка) */
  .token .slot-hand { left: 56%; top: 34%; width: 66%; height: 66%; z-index: 2; rotate: 20deg; }
  /* зірки за завдання: над колом, 1–3 маленькі дугою або одна велика з цифрою */
  .token .stars {
    position: absolute; left: 0; right: 0; top: -24%; height: 32%; z-index: 3;
    display: flex; justify-content: center;
  }
  .token .star { position: relative; width: 36%; height: 100%; margin: 0 -3%; }
  .token .star img {
    display: block; width: 100%; height: 100%;
    filter: drop-shadow(0 calc(var(--s) * .015) calc(var(--s) * .02) rgba(0, 0, 0, .4));
  }
  .token .star:first-child:nth-last-child(2) { rotate: -10deg; }
  .token .star:last-child:nth-child(2)       { rotate: 10deg; }
  .token .star:first-child:nth-last-child(3) { rotate: -16deg; translate: 0 22%; }
  .token .star:last-child:nth-child(3)       { rotate: 16deg; translate: 0 22%; }
  .token .stars.big { top: -38%; height: 48%; }
  .token .stars.big .star { width: 48%; }
  .token .star .count {
    position: absolute; inset: 8% 0 0; display: flex; align-items: center; justify-content: center;
    font: 800 calc(var(--s) * .24)/1 system-ui, sans-serif; color: #8a4300;
  }
  #turnHero .token .stars { top: -12%; height: 28%; }        /* у панелі — щоб не вилазили за край */
  #turnHero .token .stars.big { top: -20%; height: 40%; }
  .hero.left .stars { scale: -1 1; }   /* цифра не дзеркалиться */
  .hero.got .star:last-child img { animation: starpop 700ms ease-out; }
  @keyframes starpop {
    0%   { transform: scale(.2) rotate(-90deg); }
    60%  { transform: scale(1.4) rotate(10deg); }
    100% { transform: scale(1) rotate(0); }
  }
  .hero.away { opacity: .25; }   /* герой у космосі — на карті лише тінь */
  .hero-1 { --ring: #ff9f68; }   /* дитина */
  .hero-2 { --ring: #5ab8ad; }   /* дорослий */

  .hero { transition: left 170ms linear, top 170ms linear, opacity 500ms; }
  .hero.left { scale: -1 1; }   /* окремо від transform — не б'ється з гойданням */
  .hero.active { animation: sway 1.6s ease-in-out infinite; z-index: 2; }
  .hero.got .disc { animation: got 700ms ease-out; }
  @keyframes sway {
    0%, 100% { transform: rotate(-5deg); }
    50%      { transform: rotate(5deg); }
  }
  @keyframes got {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.35); box-shadow: 0 0 calc(var(--s) * .4) rgba(255, 224, 90, 1); }
    100% { transform: scale(1); }
  }
  /* переліт (кулька, гармошка, чих): фішка злітає, пливе і сідає */
  .hero.flying {
    transition: left var(--fly) ease-in-out, top var(--fly) ease-in-out; z-index: 4;
    animation: lift var(--fly) ease-in-out;
  }
  @keyframes lift {
    0%, 100% { translate: 0 0; }
    25%, 75% { translate: 0 -45%; }
  }
  .hero .carrier { position: absolute; z-index: 5; pointer-events: none; }
  img.carrier { left: 10%; top: -150%; width: 80%; height: 160%; animation: wobble 600ms ease-in-out infinite alternate; }
  .carrier.words {
    left: 50%; top: -70%; translate: -50% 0; padding: .1em .4em; border-radius: 1em;
    background: #fff; color: var(--ink); white-space: nowrap;
    font: 800 calc(var(--s) * .3)/1.2 system-ui, sans-serif;
    box-shadow: 0 2px 6px rgba(0, 0, 0, .3);
  }
  .hero.left .carrier.words { scale: -1 1; }   /* напис не дзеркалиться */
  @keyframes wobble {
    from { rotate: -6deg; }
    to   { rotate: 6deg; }
  }
  @media (prefers-reduced-motion: reduce) {
    .hero.flying, img.carrier,
    .hero.active, .token .slot-sides img, .token .slot-top img, .hero.got .star:last-child img { animation: none; }
  }

  /* ─── точка-завдання: гойдається і пульсує золотим сяйвом ─── */
  .task-mark {
    animation: bob 2s ease-in-out infinite, glow 1.1s ease-in-out infinite alternate;
    transition: opacity 400ms, transform 400ms;
  }
  .task-mark.gone { opacity: 0; transform: scale(1.6); animation: none; }
  @keyframes bob {
    0%, 100% { transform: translateY(4%) rotate(-3deg); }
    50%      { transform: translateY(-8%) rotate(3deg); }
  }
  @keyframes glow {
    from { filter: drop-shadow(0 0 calc(var(--t) * .03) rgba(255, 214, 80, .5)); }
    to   { filter: drop-shadow(0 0 calc(var(--t) * .16) rgba(255, 224, 90, 1)) brightness(1.12); }
  }
  /* приз: золоте коло з тим, що отримаєш (аватарка або крильця) */
  .task-mark.prize { --ring: #ffc93c; }
  .task-mark.prize .disc { background: radial-gradient(circle at 60% 35%, #fffbe6 0%, #ffe9a8 70%, #f6d27a 100%); }
  /* телепорт: вир повільно крутиться і світиться фіолетовим */
  .task-mark.portal { animation: spin 5s linear infinite, portalglow 1.2s ease-in-out infinite alternate; }
  @keyframes spin { to { rotate: 360deg; } }
  @keyframes portalglow {
    from { filter: drop-shadow(0 0 calc(var(--t) * .04) rgba(170, 130, 255, .6)); }
    to   { filter: drop-shadow(0 0 calc(var(--t) * .2) rgba(190, 150, 255, 1)) brightness(1.15); }
  }
  @media (prefers-reduced-motion: reduce) {
    .task-mark { animation: none; filter: drop-shadow(0 0 calc(var(--t) * .12) rgba(255, 224, 90, .9)); }
  }

  /* ─── космос за телепортом (src/core/quest.js): поверх карти, той самий розмір ─── */
  #space {
    position: absolute; inset: 0; z-index: 6; overflow: hidden;
    background: radial-gradient(ellipse at 30% 20%, #2c2f72 0%, #15183d 55%, #07081a 100%);
    opacity: 0; transition: opacity 500ms;
  }
  #space[hidden] { display: none; }
  #space.open { opacity: 1; }
  #spaceSky, #spaceStage { position: absolute; inset: 0; }
  .twinkle {
    position: absolute; border-radius: 50%; background: #fff;
    animation: twinkle 1.6s ease-in-out infinite alternate;
  }
  @keyframes twinkle { from { opacity: .15; } to { opacity: .9; } }
  #spaceTitle {
    position: absolute; left: 50%; top: calc(var(--t) * .12); translate: -50% 0; z-index: 3;
    padding: .25em .9em; border-radius: 1em; background: rgba(255, 255, 255, .14);
    font-weight: 800; font-size: calc(var(--t) * .34); white-space: nowrap; pointer-events: none;
  }
  #spaceBack {
    position: absolute; right: 8px; top: 8px; z-index: 4; width: 44px; height: 44px;
    border: 0; border-radius: 50%; background: rgba(255, 255, 255, .18); color: #fff;
    font-size: 22px; font-weight: 700; cursor: pointer;
  }
  /* темна кімната (src/quests/dark-room.js): ліхтарик, цифри в темряві, сейф */
  .dr-room {
    position: absolute; inset: 0;
    background:
      linear-gradient(rgba(10, 12, 30, .35) 2px, transparent 2px) 0 0 / var(--t) var(--t),
      linear-gradient(90deg, rgba(10, 12, 30, .35) 2px, transparent 2px) 0 0 / var(--t) var(--t),
      radial-gradient(ellipse at 50% 40%, #6a74a6 0%, #474f7c 60%, #2e3354 100%);
  }
  .dr-friend, .dr-digit, .dr-safe, .dr-lamp, .dr-say, .dr-glint, .dr-prize {
    position: absolute; width: var(--t); height: var(--t); pointer-events: none;
  }
  .dr-friend { scale: .8; }
  .dr-friend.hop { animation: drhop 500ms ease-out; }
  @keyframes drhop { 40% { translate: 0 calc(var(--t) * -.3); scale: .9; } }
  .dr-digit {
    display: flex; align-items: center; justify-content: center;
    font: 900 calc(var(--t) * .78)/1 system-ui, sans-serif; color: #ffe27a;
    -webkit-text-stroke: calc(var(--t) * .03) #6b4a00;
  }
  .dr-digit.found {
    text-shadow: 0 0 calc(var(--t) * .2) rgba(255, 200, 40, .95);
    animation: drfound 700ms ease-out, drglow 1.2s 700ms ease-in-out infinite alternate;
  }
  @keyframes drfound { from { scale: .4; } 40% { scale: 1.5; } to { scale: 1; } }
  @keyframes drglow { to { text-shadow: 0 0 calc(var(--t) * .35) rgba(255, 220, 90, 1); } }
  .dr-dark { position: absolute; inset: 0; pointer-events: none; filter: blur(calc(var(--t) * .28)); transition: opacity 1400ms; }
  .dr-dark.off { opacity: 0; }
  .dr-dark div {
    position: absolute; width: calc(var(--t) * 1.02); height: calc(var(--t) * 1.02);
    background: #04050d; opacity: .97; transition: opacity 260ms;
  }
  .dr-dark div.seen { opacity: .78; }
  .dr-dark div.dim { opacity: .5; }
  .dr-dark div.lit { opacity: 0; }
  .dr-torch {
    position: absolute; width: calc(var(--t) * 5); height: calc(var(--t) * 5); pointer-events: none;
    background: radial-gradient(circle, rgba(255, 236, 160, .3) 0%, rgba(255, 236, 160, .12) 30%, transparent 55%);
    transition: left 170ms linear, top 170ms linear;
  }
  .dr-safe { filter: brightness(.55); transition: filter 500ms; }
  .dr-safe.ready { filter: none; animation: drready 800ms ease-in-out infinite alternate; }
  @keyframes drready {
    from { filter: drop-shadow(0 0 calc(var(--t) * .05) rgba(255, 224, 90, .6)); }
    to   { filter: drop-shadow(0 0 calc(var(--t) * .3) rgba(255, 224, 90, 1)); }
  }
  .dr-lamp::after {   /* лампочка на дверцятах сейфа — гніздо в safe.png */
    content: ''; position: absolute; left: 63%; top: 31.5%; width: 12%; height: 12%; border-radius: 50%;
    background: #ff4b3e; box-shadow: 0 0 calc(var(--t) * .15) #ff4b3e;
    animation: drlamp 900ms steps(2, jump-none) infinite;
  }
  .dr-lamp.blink::after { animation: drlamp 150ms steps(2, jump-none) 6; }
  .dr-lamp.ok::after { background: #5dff9a; box-shadow: 0 0 calc(var(--t) * .25) #5dff9a; animation: none; }
  @keyframes drlamp { to { opacity: .25; } }
  .dr-say {
    display: flex; align-items: center; justify-content: center; translate: 0 calc(var(--t) * -.75); z-index: 1;
    font: 800 calc(var(--t) * .28)/1 system-ui, sans-serif; color: var(--ink); white-space: nowrap;
    animation: drsay 1400ms ease-out both;
  }
  .dr-say::before {
    content: ''; position: absolute; inset: 22% -12%; z-index: -1;
    background: #fff; border-radius: 1em; border: calc(var(--t) * .03) solid var(--ink);
  }
  @keyframes drsay { from { opacity: 0; scale: .5; } 15% { opacity: 1; scale: 1.1; } 25% { scale: 1; } 80% { opacity: 1; } to { opacity: 0; } }
  .dr-glint {
    background: radial-gradient(circle, #fff 0%, rgba(255, 240, 180, .9) 12%, transparent 40%);
    clip-path: polygon(50% 0, 58% 42%, 100% 50%, 58% 58%, 50% 100%, 42% 58%, 0 50%, 42% 42%);
    animation: drglint 1000ms ease-in-out both;
  }
  @keyframes drglint { from { opacity: 0; scale: .2; rotate: 0deg; } 50% { opacity: 1; scale: .9; } to { opacity: 0; scale: .2; rotate: 90deg; } }
  .dr-prize {
    filter: drop-shadow(0 0 calc(var(--t) * .25) rgba(255, 224, 90, 1));
    animation: drprize 1100ms ease-out both, drfloat 900ms 1100ms ease-in-out infinite alternate;
  }
  @keyframes drprize {
    from { translate: 0 0; scale: .2; rotate: -30deg; }
    60%  { translate: 0 calc(var(--t) * -1.1); scale: 1.5; rotate: 10deg; }
    to   { translate: 0 calc(var(--t) * -.85); scale: 1.3; rotate: 0deg; }
  }
  @keyframes drfloat {
    from { translate: 0 calc(var(--t) * -.85); scale: 1.3; }
    to   { translate: 0 calc(var(--t) * -1); scale: 1.3; }
  }
  .dr-tray {
    position: absolute; left: calc(var(--t) * .15); top: calc(var(--t) * .12); z-index: 3; pointer-events: none;
    display: flex; gap: calc(var(--t) * .08); padding: calc(var(--t) * .07); border-radius: calc(var(--t) * .15);
    background: rgba(255, 255, 255, .14);
  }
  .dr-slot {
    width: calc(var(--t) * .48); height: calc(var(--t) * .48); box-sizing: border-box; border-radius: calc(var(--t) * .1);
    border: calc(var(--t) * .03) dashed rgba(255, 255, 255, .45);
    display: flex; align-items: center; justify-content: center;
    font: 900 calc(var(--t) * .34)/1 system-ui, sans-serif; color: #ffe27a;
  }
  .dr-slot.filled { border-style: solid; border-color: #ffe27a; background: rgba(255, 224, 90, .15); animation: drfound 500ms ease-out; }
  @media (prefers-reduced-motion: reduce) {
    .twinkle, .dr-digit.found, .dr-safe.ready, .dr-lamp::after, .dr-prize, .dr-friend.hop { animation: none; }
  }

  /* ─── вікно завдання ─── */
  #task {
    position: fixed; inset: 0; background: rgba(0, 0, 0, .55); z-index: 10;
    display: flex; align-items: center; justify-content: center;
  }
  #task[hidden] { display: none; }
  #task .card {
    position: relative; background: #fffaf0; color: var(--ink);
    padding: 24px 40px 32px; border-radius: 20px; text-align: center;
  }
  #task h2 { margin: 0 0 8px; font-size: 26px; }
  #taskClose {
    position: absolute; top: 10px; right: 12px; width: 44px; height: 44px;
    border: 0; border-radius: 50%; background: #e8e1d2; color: var(--ink);
    font-size: 24px; font-weight: 700; cursor: pointer;
  }
  .task-pic { width: min(260px, 34vh); height: min(260px, 34vh); display: block; margin: 0 auto 16px; }
  .task-choices { display: flex; gap: 16px; justify-content: center; }
  .task-word {
    min-width: 150px; padding: 14px 22px; border: 4px solid #d8cdb6; border-radius: 16px;
    background: #fff; color: var(--ink); cursor: pointer;
    font: 700 40px/1 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: .06em;
    transition: transform 120ms, background 200ms, border-color 200ms, opacity 300ms;
  }
  .task-word:hover:not(:disabled) { transform: scale(1.06); border-color: #f2c14e; }
  .task-word.right { background: #b7e4a6; border-color: #3f9b5f; transform: scale(1.12); }
  .task-word.wrong { animation: shake 400ms; opacity: .35; cursor: default; }

  /* «Порахуй»: приклад і порожня клітинка під відповідь */
  .task-sum {
    display: flex; gap: 18px; align-items: center; justify-content: center; margin: 16px 0 34px;
    font: 800 76px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .task-sum-gap {
    min-width: 100px; padding: 6px 10px; border: 5px dashed #d8cdb6; border-radius: 16px;
    background: #fffdf7; color: #b9ab90; transition: background 200ms, border-color 200ms;
  }
  .task-sum-gap.filled { border-style: solid; border-color: #3f9b5f; background: #b7e4a6; color: var(--ink); animation: hop 500ms; }
  .task-number { min-width: 110px; font-size: 54px; }

  /* «Знайди картинку»: велике слово і три картинки-кнопки */
  .task-big-word {
    margin: 10px 0 26px; font: 800 64px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
    letter-spacing: .1em;
  }
  .task-pic-choice {
    width: min(190px, 26vh); height: min(190px, 26vh); padding: 10px;
    border: 4px solid #d8cdb6; border-radius: 20px; background: #fff; cursor: pointer;
    transition: transform 120ms, background 200ms, border-color 200ms, opacity 300ms;
  }
  .task-pic-choice img { display: block; width: 100%; height: 100%; }
  .task-pic-choice:hover:not(:disabled) { transform: scale(1.06); border-color: #f2c14e; }
  .task-pic-choice.right { background: #b7e4a6; border-color: #3f9b5f; transform: scale(1.12); }
  .task-pic-choice.wrong { animation: shake 400ms; opacity: .3; cursor: default; }

  /* «Склади слово»: клітинки під літери і розсипані літери */
  .task-slots { display: flex; gap: 10px; justify-content: center; align-items: flex-end; margin-bottom: 26px; }
  .task-slot, .task-tile {
    width: 72px; height: 80px; border-radius: 14px;
    font: 700 46px/1 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink);
    display: flex; align-items: center; justify-content: center;
  }
  .task-slot { border: 4px dashed #d8cdb6; background: #fffdf7; box-sizing: border-box; transition: background 200ms, border-color 200ms; }
  .task-slot.current { border-color: #f2c14e; animation: wait 1s ease-in-out infinite alternate; }
  .task-slot.filled { border-style: solid; border-color: #b9ab90; background: #fff; }
  .task-slots.done .task-slot { background: #b7e4a6; border-color: #3f9b5f; animation: hop 500ms; }
  .task-slot-mark { font: 700 46px/80px system-ui, sans-serif; width: 14px; }
  .task-tray { display: flex; gap: 18px; justify-content: center; padding: 14px 0 6px; min-height: 100px; }
  .task-tile {
    border: 4px solid #d8cdb6; background: #fff; cursor: pointer; padding: 0; box-sizing: border-box;
    box-shadow: 0 4px 0 #d8cdb6;
    transform: translateY(var(--dy)) rotate(var(--rot));
    transition: transform 120ms, border-color 200ms;
  }
  .task-tile:hover:not(:disabled) { border-color: #f2c14e; }
  .task-tile.flying { transition: transform 320ms ease-in-out; z-index: 1; box-shadow: none; }
  .task-tile.used { visibility: hidden; }
  .task-tile.wrong { animation: nudge 400ms; }
  .task-tile.hint { border-color: #f2c14e; animation: hintglow 700ms ease-in-out infinite alternate; }
  @keyframes wait { from { background: #fffdf7; } to { background: #fff1c4; } }
  @keyframes hintglow { from { box-shadow: 0 4px 0 #d8cdb6; } to { box-shadow: 0 0 18px 6px rgba(255, 210, 63, .9); } }
  @keyframes hop { 50% { transform: translateY(-12px); } }
  @keyframes nudge {
    0%, 100% { translate: 0; }
    20%, 60% { translate: -10px; }
    40%, 80% { translate: 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .task-tile { transform: none; }
    .task-slot.current, .task-tile.hint { animation: none; }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-10px); }
    40%, 80% { transform: translateX(10px); }
  }

  /* кодовий замок сейфа (src/quests/dark-room.js) */
  .lock-clue {
    display: flex; gap: 12px; justify-content: center; align-items: center; margin: 8px 0 16px;
    font: 900 44px/1 system-ui, sans-serif;
  }
  .lock-card {
    width: 64px; height: 80px; border-radius: 12px; box-sizing: border-box;
    display: flex; align-items: center; justify-content: center;
    background: #fff3c4; border: 3px solid #e6c65a; color: #7a5a00; font: 900 54px/1 system-ui, sans-serif;
    transition: opacity 200ms, scale 200ms;
  }
  .lock-card.next { border-color: #f2a01e; scale: 1.12; box-shadow: 0 0 14px 4px rgba(255, 200, 60, .7); }
  .lock-card.used { opacity: .35; }
  .lock-screen {
    display: flex; gap: 10px; justify-content: center; width: max-content; margin: 0 auto 18px;
    padding: 12px 18px; border-radius: 14px; background: #1d2338; box-shadow: inset 0 3px 8px rgba(0, 0, 0, .6);
  }
  .lock-cell {
    width: 56px; height: 72px; border-radius: 8px; background: #0e1322;
    font: 900 56px/72px ui-monospace, monospace; color: #5dff9a; text-shadow: 0 0 10px rgba(93, 255, 154, .7);
  }
  .lock-cell.current { box-shadow: inset 0 -6px 0 rgba(93, 255, 154, .45); }
  .lock-screen.bad { animation: shake 400ms; }
  .lock-screen.ok .lock-cell { background: #14422b; color: #b6ffd0; }
  .lock-keys { display: grid; grid-template-columns: repeat(5, 72px); gap: 12px; justify-content: center; }
  .lock-key {
    height: 72px; border: 0; border-radius: 50%; cursor: pointer;
    background: radial-gradient(circle at 35% 30%, #fff, #d6dcea 60%, #a3adc2);
    box-shadow: 0 4px 0 #6b7590; color: var(--ink); font: 900 38px/1 system-ui, sans-serif;
  }
  .lock-key:hover { background: radial-gradient(circle at 35% 30%, #fff, #fff1c4 60%, #e6c65a); }
  .lock-key:active { translate: 0 3px; box-shadow: 0 1px 0 #6b7590; }
  .lock-key.wrong { animation: nudge 400ms; }

  /* ─── підказки й перемога ─── */
  #toast {
    position: fixed; left: 50%; top: 76px; transform: translateX(-50%);
    padding: 10px 20px; border-radius: 10px; background: rgba(30, 30, 26, .85);
    font-weight: 600; opacity: 0; transition: opacity 200ms; pointer-events: none;
  }
  #toast.show { opacity: 1; }
  #win {
    position: fixed; inset: 0; background: rgba(0, 0, 0, .55);
    display: flex; align-items: center; justify-content: center;
  }
  #win[hidden] { display: none; }
  #win .card {
    background: #fffaf0; color: var(--ink); padding: 32px 48px; border-radius: 16px;
    text-align: center;
  }
  #win h1 { margin: 0 0 8px; font-size: 34px; }
  #win img { width: 72px; height: 72px; }
  #win button {
    margin: 18px 6px 0; padding: 12px 28px; border: 0; border-radius: 10px;
    background: #3f6f4a; color: #fff; cursor: pointer;
    font-family: inherit; font-size: 18px; font-weight: 700;
  }
  #win #again { background: #8a8270; }
</style>
